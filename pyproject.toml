# ============================================================================
# Workspace Configuration for canVODpy Monorepo
# ============================================================================

[tool.uv.workspace]
members = ["packages/*", "canvodpy"]
exclude = ["packages/canvod-filemap"]

# canvod-filemap and canvod-adapters live in the separate canvodpy-extensions
# repo (https://github.com/nfb2021/canvodpy-extensions), not in this
# monorepo's workspace. Point uv at the public repo directly — a local
# sibling-path source would break `uv run`/`uv sync` on any machine without
# that repo cloned alongside canvodpy, since uv resolves optional-dependency-
# group sources even when the extra isn't requested.
[tool.uv.sources]
canvod-filemap = { git = "https://github.com/nfb2021/canvodpy-extensions.git", subdirectory = "packages/canvod-filemap", tag = "v0.1.0" }
canvod-adapters = { git = "https://github.com/nfb2021/canvodpy-extensions.git", subdirectory = "packages/canvod-adapters", tag = "v0.1.0" }

# ============================================================================
# Development Dependencies (Workspace-wide)
# ============================================================================

[dependency-groups]
dev = [
    "anywidget>=0.11.0",
    "commitizen>=4.19.2",
    "hypothesis>=6.170.5",
    "ipykernel>=7.4.0",
    "loky>=3.7.0",
    "marimo>=0.25.2",
    "mkdocstrings-python>=2.0.10",
    "mystmd>=1.11.0",
    "pre-commit>=4.7.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "traitlets>=5.16.1",
    "ty>=0.0.89",
    "zensical>=0.0.71",
]

# ============================================================================
# Ruff Configuration (Workspace-wide)
# ============================================================================
# Philosophy: catch real bugs, enforce consistent formatting, don't fight
# scientists over naming or style. This is a research codebase.

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
# demo/ is a separate git submodule (canvodpy-demo) with its own lint
# config and history -- ruff walks the filesystem regardless of git
# submodule boundaries, so without this it "fixes" demo/'s files on disk
# on every commit here, which trips pre-commit's modified-files abort.
# force-exclude is required too: pre-commit passes explicit filenames
# (not a directory to walk), and `exclude` alone is silently ignored for
# explicitly-passed paths unless force-exclude is also set.
#
# This `exclude` reliably covers `ruff check` (confirmed: 0 demo/ files
# flagged) but NOT `ruff format`'s own directory walk -- ruff format
# still descends into demo/ once it finds demo/pyproject.toml, even
# though that file has no [tool.ruff] section of its own (confirmed
# empirically, not documented ruff behavior we could find). The same gap
# applies to any workspace package under packages/*/, each of which has
# its own [tool.ruff] section shadowing this one, and to the new default
# where `ruff format` also reformats fenced Python code in Markdown.
# justfile's check-format/check-format-only recipes carry the actual
# fix (`--exclude "demo"` / `--exclude "*.md"` on the CLI, which works
# regardless of nested pyproject.toml resolution) -- this root `exclude`
# is kept for `ruff check` and as a form of documentation, not as the
# mechanism that keeps `ruff format` out of demo/.
exclude = ["demo"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes (undefined names, unused imports, etc.)
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (use modern Python syntax)
    "B",     # flake8-bugbear (catches likely bugs)
    "RUF",   # ruff-specific rules
]
# Dropped (stylistic, not bugs):
#   N   — naming (scientists use N, K, theta, phi, SNR, VOD ...)
#   SIM — simplify (opinionated if-else and ternary preferences)
#   C4  — comprehensions (dict() vs {} is not a bug)
#   PIE — misc lints (noise)
#   PT  — pytest style (4 violations, all opinionated)

ignore = [
    # --- Formatter handles these ---
    "E501",    # line-too-long: ruff format enforces 88 chars for code;
               # E501 fires on long strings/URLs the formatter can't break
    "W291",    # trailing-whitespace (formatter)
    "W293",    # blank-line-with-whitespace (formatter)
    "COM812",  # missing-trailing-comma (conflicts with ruff formatter)

    # --- Scientific code ---
    "F841",    # unused-variable (intermediate results, exploratory analysis)
    "RUF001",  # ambiguous-unicode-character-string (degree symbols, mu, etc.)
    "RUF002",  # ambiguous-unicode-character-docstring (GNSS notation)
    "RUF003",  # ambiguous-unicode-character-comment

    # --- Marimo notebooks ---
    "B018",    # useless-expression (marimo cells display via bare expressions)

    # --- Pragmatic ---
    "B905",    # zip-without-explicit-strict (not a real bug)
    "B007",    # unused-loop-control-variable (common in scientific iteration)
    "RUF059",  # unused-unpacked-variable (destructuring for clarity)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]           # re-exports and lazy imports
"**/{tests}/*" = ["S101", "PLR2004"]       # assert and magic values OK in tests
"**/demo/**" = ["F811", "F821", "F401", "E402"]  # marimo notebooks: cross-cell refs, re-exports

[tool.ruff.lint.isort]
known-first-party = ["canvod"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# ty Configuration (Workspace-wide)
# ============================================================================

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Ignore unresolved imports: workspace packages may not be installed in isolation
# and optional deps (pint, polars, icechunk) are not always present.
unresolved-import = "ignore"

[tool.ty.src]
# Tests use assert, magic numbers and intentional patterns — skip entirely.
# Demo notebooks are not production code.
# The two store files below have deep icechunk/xarray generics that need
# dedicated refactoring before ty can analyse them cleanly.
exclude = [
    "**/tests/**",
    "demo/**",
    "dev/**",
    "prototypes/**",
    "packages/canvod-store/src/canvod/store/grid_adapters/grid_storage.py",
    "packages/canvod-store/src/canvod/store/store.py",
]

# ============================================================================
# Pytest Configuration (Workspace-wide)
# ============================================================================

[tool.pytest.ini_options]
testpaths = [
    "canvodpy/tests",
    "packages/canvod-auxiliary/tests",
    "packages/canvod-config/tests",
    "packages/canvod-grids/tests",
    "packages/canvod-preflight/tests",
    "packages/canvod-readers/tests",
    "packages/canvod-store/tests",
    "packages/canvod-store-metadata/tests",
    "packages/canvod-utils/tests",
    "packages/canvod-viz/tests",
    "packages/canvod-vod/tests",
    "packages/canvod-ops/tests",
]
addopts = "--cov --cov-report term-missing --cov-report lcov -rsx --verbose --color=yes"
markers = [
    "integration: marks tests as integration tests (may require config files or external resources)",
]

[tool.coverage.run]
relative_files = true
source = [
    "canvodpy/src",
    "packages/canvod-auxiliary/src",
    "packages/canvod-config/src",
    "packages/canvod-grids/src",
    "packages/canvod-preflight/src",
    "packages/canvod-readers/src",
    "packages/canvod-store/src",
    "packages/canvod-store-metadata/src",
    "packages/canvod-utils/src",
    "packages/canvod-viz/src",
    "packages/canvod-vod/src",
    "packages/canvod-ops/src",
]

# ============================================================================
# Commitizen Configuration (Conventional Commits)
# ============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.0"
version_files = [
    "canvodpy/pyproject.toml:version",
    "packages/canvod-readers/pyproject.toml:version",
    "packages/canvod-auxiliary/pyproject.toml:version",
    "packages/canvod-config/pyproject.toml:version",
    "packages/canvod-grids/pyproject.toml:version",
    "packages/canvod-preflight/pyproject.toml:version",
    "packages/canvod-vod/pyproject.toml:version",
    "packages/canvod-store/pyproject.toml:version",
    "packages/canvod-store-metadata/pyproject.toml:version",
    "packages/canvod-viz/pyproject.toml:version",
    "packages/canvod-utils/pyproject.toml:version",
    "packages/canvod-ops/pyproject.toml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
annotated_tag = true

[tool.commitizen.customize]
# Monorepo scopes for canvodpy
scopes = [
    "readers",
    "aux",
    "config",
    "grids",
    "vod",
    "store",
    "viz",
    "utils",
    "naming",
    "orchestrator",
    "diagnostics",
    "ops",
    "ci",
    "docs",
    "deps",
]

# ============================================================================
# ty Configuration (Type Checking)
# ============================================================================
# These two files have hundreds of zarr/icechunk stub-noise errors.
# The errors are from weak third-party stubs (NDArrayLike, Group, Array),
# not real bugs. Suppress all diagnostics for those files.

[[tool.ty.overrides]]
include = ["packages/canvod-store/src/canvod/store/store.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
invalid-return-type = "ignore"
missing-argument = "ignore"
possibly-missing-submodule = "ignore"
deprecated = "ignore"

[[tool.ty.overrides]]
include = ["packages/canvod-store/src/canvod/store/grid_adapters/grid_storage.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
invalid-return-type = "ignore"
missing-argument = "ignore"
possibly-missing-submodule = "ignore"
deprecated = "ignore"
