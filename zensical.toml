# The Impressum is linked from the footer (overrides/partials/copyright.html).

# --------------------------------------------------------------------------
# Plugins
# --------------------------------------------------------------------------
[project.plugins.mkdocstrings.handlers.python]
[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
# Deprecated code still ships until the next major version, but the docs
# leave it out (scripts/griffe_hide_deprecated.py).
extensions = ["scripts/griffe_hide_deprecated.py:HideDeprecated"]
show_source = false
show_bases = true
members_order = "source"

# --------------------------------------------------------------------------
# Markdown extensions
# --------------------------------------------------------------------------
# When customising ANY extension, ALL desired extensions must be listed
# because zensical replaces defaults rather than merging.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
# Outside docs/ so it is not published as a page of its own.
auto_append = ["includes/abbreviations.md"]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# --------------------------------------------------------------------------
# Theme
# --------------------------------------------------------------------------
[project.theme]
language = "en"
# The header is dark green in both color schemes, so it takes the light
# (dark mode) logo. The favicon follows the browser's color scheme
# (overrides/main.html adds the dark one).
logo = "assets/logo/canvodpy_logo_dark_mode.svg"
favicon = "assets/logo/canvodpy_favicon_bright_mode.svg"
# Template overrides; outside docs/ so they are not published as pages.
custom_dir = "overrides"

features = [
  "content.code.copy",
  "content.code.annotate",
  "content.footnote.tooltips",
  "content.tooltips",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# The first palette is the default: dark mode.
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# --------------------------------------------------------------------------
# Social links (footer)
# --------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nfb2021/canvodpy"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/canvodpy/"
