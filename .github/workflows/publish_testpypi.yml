name: Publish to TestPyPI

# Trigger on tags or manual dispatch
on:
  push:
    tags:
      - 'v*.*.*-beta.*'  # e.g., v0.1.0-beta.1
      - 'v*.*.*-alpha.*'  # e.g., v0.1.0-alpha.1
      - 'v*.*.*-rc.*'     # e.g., v0.1.0-rc.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication

jobs:
  build-and-publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi  # GitHub environment for protection rules

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Build all packages
        run: |
          rm -rf dist/
          mkdir -p dist/

          # Build each package, collecting output into root dist/
          for pkg in \
            packages/canvod-readers \
            packages/canvod-auxiliary \
            packages/canvod-config \
            packages/canvod-grids \
            packages/canvod-store \
            packages/canvod-store-metadata \
            packages/canvod-utils \
            packages/canvod-viz \
            packages/canvod-vod \
            packages/canvod-ops \
            packages/canvod-preflight \
            canvodpy; do
            echo "Building $pkg..."
            uv build --package "$(basename $pkg)" --out-dir dist/
          done

          echo "Built packages:"
          ls -lh dist/*.whl

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # Don't fail if version already exists
          verbose: true
