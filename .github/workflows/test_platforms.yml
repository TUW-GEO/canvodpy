name: Platform Tests

on:
    workflow_call: # from ci.yml, its only trigger
        inputs:
            # The Ubuntu job measures the coverage, uploads it to Coveralls
            # and writes the coverage comment on the pull request.
            coverage:
                type: boolean
                default: false

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    build:
        name: Tests • ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write # the coverage comment keeps its data on a branch
            pull-requests: write # the coverage comment
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - Ubuntu'
                    - os: windows-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - Windows'
                    - os: macos-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - macOS'

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check out the test data
              # Only the readers' test data, without its history; the demo
              # submodule is not needed for the tests. Switched off for now:
              # remove the `if` to run the tests that need the data.
              if: false
              run: git submodule update --init --depth 1 packages/canvod-readers/tests/test_data
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
            - name: Set up Python
              run: uv python install
            - name: Install the Project
              # healpy (canvod-grids' HEALPix grid builder, canvod-grids'
              # `optional` group) ships no Windows wheels on PyPI, so it's
              # only installable on Linux/macOS -- HEALPix-dependent tests
              # skip on Windows, same as a local dev machine without it.
              # --group filemap (canvod-filemap, from canvodpy-extensions)
              # runs the recipe tests, which skip without it.
              if: matrix.os != 'windows-latest'
              run: uv sync --locked --dev --group optional --group filemap
            - name: Install the Project (Windows, no healpy)
              if: matrix.os == 'windows-latest'
              run: uv sync --locked --dev --group filemap
            - name: Run Tests with Coverage
              if: inputs.coverage && matrix.os == 'ubuntu-latest'
              run: uv run pytest
            - name: Upload to Coveralls
              if: inputs.coverage && matrix.os == 'ubuntu-latest'
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  file: coverage.lcov
            - name: Coverage comment
              if: inputs.coverage && matrix.os == 'ubuntu-latest'
              uses: py-cov-action/python-coverage-comment-action@2136b292bfcd2a9925b36a46960fcb6f7be8e7fe # v3
              with:
                  GITHUB_TOKEN: ${{ github.token }}
                  VERBOSE: false
            - name: Run Tests
              if: ${{ !(inputs.coverage && matrix.os == 'ubuntu-latest') }}
              run: |
                  uv run pytest canvodpy/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-auxiliary/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-config/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-readers/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-store/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-store-metadata/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-grids/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-viz/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-preflight/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-vod/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-ops/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-utils/tests/ --verbose --color=yes
