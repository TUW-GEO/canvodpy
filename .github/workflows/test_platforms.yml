name: Platform Tests

on:
    push:
    pull_request:
    schedule:
        - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions: read-all

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    build:
        name: Tests • ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - Ubuntu'
                    - os: windows-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - Windows'
                    - os: macos-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - macOS'

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check out the test data
              # Only the readers' test data, without its history; the demo
              # submodule is not needed for the tests. Switched off for now:
              # remove the `if` to run the tests that need the data.
              if: false
              run: git submodule update --init --depth 1 packages/canvod-readers/tests/test_data
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
            - name: Set up Python
              run: uv python install
            - name: Install the Project
              # healpy (canvod-grids' HEALPix grid builder, canvod-grids'
              # `optional` group) ships no Windows wheels on PyPI, so it's
              # only installable on Linux/macOS -- HEALPix-dependent tests
              # skip on Windows, same as a local dev machine without it.
              if: matrix.os != 'windows-latest'
              run: uv sync --locked --dev --group optional
            - name: Install the Project (Windows, no healpy)
              if: matrix.os == 'windows-latest'
              run: uv sync --locked --dev
            - name: Run Tests
              run: |
                  uv run pytest canvodpy/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-auxiliary/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-config/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-readers/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-store/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-store-metadata/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-grids/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-viz/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-preflight/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-vod/tests/ --verbose --color=yes
                  uv run pytest packages/canvod-ops/tests/ --verbose --color=yes
