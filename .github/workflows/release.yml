# GitHub Release Workflow
# Automatically creates a draft release when a canvodpy tag is pushed.
# Package tags (canvod-store-v1.1.0) get no GitHub release of their own:
# canvodpy's release lists the package versions it pins.
# https://docs.github.com/en/actions/using-workflows

name: Release

on:
  push:
    tags:
      - "v*.*.*"           # canvodpy: v1.0.0, also pre-releases as Python
                           # writes them (v1.1.0a1, v1.1.0b1, v1.1.0rc1)

permissions: read-all

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1  # CHANGELOG.md of the tagged commit

      - name: Release notes from canvodpy's CHANGELOG section
        run: |
          # The section scripts/release.py wrote for this tag: from its
          # "## <tag> (date)" heading to the next "## " heading.
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Determine if this is a pre-release
          if echo "${{ github.ref_name }}" | grep -qE '[0-9](a|b|rc)[0-9]+$'; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi

          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "canvodpy ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --draft \
            $PRERELEASE \
            --verify-tag

      - name: Summary
        run: |
          echo "✅ Draft release created: ${{ github.ref_name }}"
          echo "📝 Review at: https://github.com/${{ github.repository }}/releases"
          echo "🚀 Publish the release manually when ready"
