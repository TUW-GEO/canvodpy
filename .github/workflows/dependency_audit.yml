name: Dependency Audit

# Checks the locked dependencies against known vulnerabilities (just audit,
# pip-audit). It runs when the dependencies change; publish_pypi.yml runs the
# same check before every upload. Dependabot covers new advisories weekly.
on:
    pull_request:
        paths:
            - 'uv.lock'
            - '**/pyproject.toml'
            - 'Justfile'
            - '.github/workflows/dependency_audit.yml'
    workflow_dispatch:

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
            - name: Install just
              uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
              with:
                  tool: just
            - name: Check the locked dependencies for known vulnerabilities
              run: just audit
