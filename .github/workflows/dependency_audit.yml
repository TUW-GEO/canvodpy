name: Dependency Audit

# Checks the locked dependencies against known vulnerabilities (just audit,
# pip-audit). It runs when the dependencies change; publish_pypi.yml runs the
# same check before every upload. Dependabot covers new advisories weekly.
on:
    pull_request:
        paths:
            - 'uv.lock'
            - '**/pyproject.toml'
            - 'Justfile'
            - '.github/workflows/dependency_audit.yml'
    workflow_dispatch:

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Check the locked dependencies for known vulnerabilities
              run: just audit
