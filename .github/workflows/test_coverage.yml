name: Test with coverage

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions: read-all

jobs:
    test_coverage:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  python-version: '3.14'
                  enable-cache: true

            - name: Set up Python
              run: uv python install

            - name: Update lock file (Dependabot only)
              if: github.actor == 'dependabot[bot]'
              run: uv lock
            - name: Install the Project
              # --group optional pulls in healpy (canvod-grids' HEALPix grid
              # builder) so HEALPix-dependent tests actually run in CI
              # instead of silently skipping.
              run: uv sync --locked --dev --group optional

            - name: Run Tests with Coverage
              run: uv run pytest

            - name: Upload to Coveralls
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  file: coverage.lcov

            - name: Coverage comment
              id: coverage_comment
              uses: py-cov-action/python-coverage-comment-action@5e8345d0e1e50beb87cb2678a534e28619cbd784 # v3
              with:
                  GITHUB_TOKEN: ${{ github.token }}
                  VERBOSE: false
