name: Python Code Quality

on:
    push:
    pull_request:
    schedule:
        - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC

permissions: read-all

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    lock_file:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Check uv.lock is up to date
              run: just check-lock

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Build every package without the workspace sources
              run: just check-build

    linting:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Lint with ruff
              run: just check-lint-only

    formatting:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Check formatting
              run: just check-format-only

    type_consistency:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Type check with ty
              run: just check-types

    package_imports:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Import each package with only its declared dependencies
              run: just check-package-imports

    agent_docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
              with:
                  tool: just
            - name: Check out canvodpy-extensions, to check the extensions paths too
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: TUW-GEO/canvodpy-extensions
                  path: canvodpy-extensions-checkout
                  fetch-depth: 0 # with the tags: the locked release tag
                  persist-credentials: false
            - name: Check paths and recipes named in AGENTS.md and skills
              env:
                  CANVODPY_EXTENSIONS_REPO: canvodpy-extensions-checkout
              run: just check-agent-docs
