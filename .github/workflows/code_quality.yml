name: Python Code Quality

on:
    push:
    pull_request:
    schedule:
        - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC

permissions: read-all

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    lock_file:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
              with:
                  tool: just
            - name: Check uv.lock is up to date
              run: just check-lock

    linting:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
              with:
                  tool: just
            - name: Lint with ruff
              run: just check-lint-only

    formatting:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
              with:
                  tool: just
            - name: Check formatting
              run: just check-format-only

    type_consistency:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
              with:
                  tool: just
            - name: Type check with ty
              run: just check-types

    package_imports:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
              with:
                  tool: just
            - name: Import each package with only its declared dependencies
              run: just check-package-imports

    agent_docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
              with:
                  tool: just
            - name: Check out canvodpy-extensions, to check the extensions paths too
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: nfb2021/canvodpy-extensions
                  path: canvodpy-extensions-checkout
                  fetch-depth: 0 # the locked commit may be on any branch
                  persist-credentials: false
            - name: Check paths and recipes named in AGENTS.md and skills
              env:
                  CANVODPY_EXTENSIONS_REPO: canvodpy-extensions-checkout
              run: just check-agent-docs
