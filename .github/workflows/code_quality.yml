name: Python Code Quality

on:
    workflow_call: # from ci.yml, its only trigger
        inputs:
            docs_only:
                # True skips the type check, the package build, and the
                # package-import check.
                type: boolean
                default: false

permissions: read-all

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    lock_file:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Check uv.lock is up to date
              run: just check-lock

    build:
        if: ${{ !inputs.docs_only }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Build every package without the workspace sources
              run: just check-build

    linting:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Lint with ruff
              run: just check-lint-only
            - name: Check the format of the release notebooks
              run: just check-release-notes

    formatting:
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Check formatting
              run: just check-format-only

    type_consistency:
        if: ${{ !inputs.docs_only }}
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Type check with ty
              run: just check-types

    package_imports:
        if: ${{ !inputs.docs_only }}
        runs-on: ubuntu-latest
        needs: [lock_file]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Import each package with only its declared dependencies
              run: just check-package-imports

    agent_docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install just
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: just
            - name: Check out canvodpy-extensions, to check the extensions paths too
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: TUW-GEO/canvodpy-extensions
                  path: canvodpy-extensions-checkout
                  fetch-depth: 0 # with the tags: the locked release tag
                  persist-credentials: false
            - name: Check paths and recipes named in AGENTS.md and skills
              env:
                  CANVODPY_EXTENSIONS_REPO: canvodpy-extensions-checkout
              run: just check-agent-docs
