name: Publish to PyPI

# Manual only -- deliberately not triggered by tag push. Tagging creates the
# GitHub tags and the draft release of canvodpy (see release.yml)
# independently of a PyPI release; publishing to PyPI is a separate,
# explicit decision made at whatever point via this dispatch. Run it on the
# canvodpy tag of the release:
#   gh workflow run publish_pypi.yml --ref v1.1.0
# It publishes the packages whose release tag points at that commit.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi  # GitHub environment for protection rules

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags, to find the packages released here

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Build the packages released at this commit
        run: |
          # Each package has its own version and tag (canvod-store-v1.1.0,
          # v1.1.0 for canvodpy); build exactly those whose release tag
          # points at this commit (scripts/release.py tagged).
          packages="$(uv run --no-project --with packaging python scripts/release.py tagged)"
          rm -rf dist/
          mkdir -p dist/
          for pkg in $packages; do
            echo "Building $pkg..."
            uv build --package "$pkg" --out-dir dist/
          done

          echo "Built packages:"
          ls -lh dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          verbose: true
          skip_existing: true
