repos:
  - repo: local
    hooks:
      # Use uv-managed ruff so local hooks and CI always use the same version
      - id: ruff-check
        name: ruff lint
        # --locked: never write uv.lock, and fail loudly when it is out of
        # date ("run `uv lock`"). A plain `uv run` would rewrite it as a side
        # effect, and pre-commit would abort with uv.lock "modified by this
        # hook"; --frozen would lint silently with a stale lock.
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        # --exclude "*.md": harmless here since `types: [python]` already
        # keeps pre-commit from passing markdown files to this hook -- kept
        # for symmetry with the justfile/CI invocation, which does need it
        # (see pyproject.toml's [tool.ruff] exclude comment for why the
        # root config's `exclude` can't do this instead).
        entry: uv run --locked ruff format --exclude "*.md"
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      # Update the uv lockfile
      - id: uv-lock
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      # Paths and just recipes named in AGENTS.md files and skills must exist;
      # runs on every commit, since renaming code can break them too
      - id: check-agent-docs
        name: agent docs
        entry: uv run --no-sync python scripts/check_agent_docs.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Keep the code graph (`just graph`, free, no LLM) in step with the code;
      # runs in the background, output in .graphify/build.log
      - id: code-graph
        name: code graph
        entry: bash -c 'mkdir -p .graphify && (just graph > .graphify/build.log 2>&1 &)'
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit, post-merge, post-checkout]
      - id: ty-check
        name: ty type check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: update-submodules
        name: update submodules
        entry: just update-submodules
        language: system
        pass_filenames: false
        stages: [post-merge]
