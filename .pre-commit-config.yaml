repos:
  - repo: local
    hooks:
      # Use uv-managed ruff so local hooks and CI always use the same version
      - id: ruff-check
        name: ruff lint
        # --frozen: use uv.lock exactly as committed, never re-resolve/write
        # it as a side effect of `uv run`. Without this, any yanked/stale
        # package upstream (e.g. a yanked PyPI release) makes plain `uv run`
        # silently rewrite uv.lock on every hook invocation -- pre-commit
        # then sees uv.lock "modified by this hook" (misattributed to ruff,
        # which never touched it) and aborts the commit.
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        # --exclude "*.md": harmless here since `types: [python]` already
        # keeps pre-commit from passing markdown files to this hook -- kept
        # for symmetry with the justfile/CI invocation, which does need it
        # (see pyproject.toml's [tool.ruff] exclude comment for why the
        # root config's `exclude` can't do this instead).
        entry: uv run --frozen ruff format --exclude "*.md"
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      # Update the uv lockfile
      - id: uv-lock
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: update-submodules
        name: update submodules
        entry: just update-submodules
        language: system
        pass_filenames: false
        stages: [post-merge]
