# Vale: style and language check for the docs (just docs-lint).
# `vale sync` downloads the Google package into .vale/styles (git-ignored);
# our own words live in .vale/styles/config/vocabularies/canvodpy.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = canvodpy

[docs/**/*.md]
BasedOnStyles = Vale, Google

# The API reference pages list members in mkdocstrings `:::` blocks:
# code names, not prose. Display math, $$...$$, is TeX, not prose.
# Code fenced inside an admonition (indented by four spaces) is code.
# Footnote references ("[^3]: Stallman, R. ...") cite authors and
# titles as published.
BlockIgnores = (?m)^::: [^\n]+(\n {4}[^\n]*)*, (?s)\$\$.*?\$\$, (?sm)^ {4}```.*?^ {4}```, (?m)^\[\^[^\]]+\]: [^\n]+

# Icon shortcodes of the cards, for example :fontawesome-solid-globe:, are
# markup, not prose (they end in a colon). Inline math, $\theta$, is TeX,
# not words.
TokenIgnores = :(fontawesome|octicons|material)-[a-z0-9-]+:|\$[^$\s][^$\n]*\$

# The command-line reference is written by scripts/cli_docs.py from the
# --help texts. Its option lists read "`--option`: Text", and Typer cuts the
# command summaries with "...": both are the page's format, not prose.
# Typer also writes the defaults, for example "[default: tau_omega]": they
# are values, not words. The help of --show-completion is Typer's own
# text, not ours.
[docs/api/cli.md]
Google.Colons = NO
Google.Ellipses = NO
TokenIgnores = \[default: [^\]]*\], Show completion for the current shell, to copy it or customize the installation\.
