version = 1
revision = 5
requires-python = ">=3.14"
resolution-markers = [
    "platform_machine == 'ARM64' and sys_platform == 'win32'",
    "platform_machine != 'ARM64' and sys_platform == 'win32'",
    "sys_platform == 'emscripten'",
    "sys_platform != 'emscripten' and sys_platform != 'win32'",
]

[manifest]
