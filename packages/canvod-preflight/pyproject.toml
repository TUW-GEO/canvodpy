[project]
name = "canvod-preflight"
version = "0.4.0"
description = "The canVOD file name convention for GNSS-T receiver files"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "file names",
    "naming convention",
    "RINEX",
    "SBF",
    "NMEA",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.5.0",
    "natsort>=8.4.0",
    "typer>=0.12",
    "canvod-utils>=0.4.0,<2",
]

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy"
Documentation = "https://canvodpy.eu/packages/naming/overview/"
Repository = "https://github.com/nfb2021/canvodpy"
Issues = "https://github.com/nfb2021/canvodpy/issues"

[project.scripts]
canvod-preflight = "canvod.preflight.cli:app"

[tool.uv.sources]
canvod-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.preflight"
