[project]
name = "canvod-preflight"
version = "0.4.0"
description = "Pre-flight GNSS-T data validation: naming convention, format checks, gap detection"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.5.0",
    "natsort>=8.4.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy"
Documentation = "https://canvodpy.eu/packages/preflight/overview/"
Repository = "https://github.com/nfb2021/canvodpy"
Issues = "https://github.com/nfb2021/canvodpy/issues"

[project.scripts]
canvod-preflight = "canvod.preflight.cli:app"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.preflight"
