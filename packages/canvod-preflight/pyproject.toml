[project]
name = "canvod-preflight"
version = "0.4.0"
description = "The canVOD GNSS-T filename convention"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.5.0",
    "natsort>=8.4.0",
    "typer>=0.12",
    "canvod-utils>=0.4.0,<2",
]

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy"
Documentation = "https://canvodpy.eu/packages/naming/overview/"
Repository = "https://github.com/nfb2021/canvodpy"
Issues = "https://github.com/nfb2021/canvodpy/issues"

[project.scripts]
canvod-preflight = "canvod.preflight.cli:app"

[tool.uv.sources]
canvod-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.preflight"
