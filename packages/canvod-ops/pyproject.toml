[project]
name = "canvod-ops"
version = "0.4.0"
description = "Preprocessing of GNSS observations: temporal aggregation and grid cell assignment"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "VOD",
    "preprocessing",
    "temporal aggregation",
    "hemispheric grid",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "xarray>=2024.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "canvod-config>=1.0.0,<2",
    "canvod-grids>=1.0.0,<2",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "canvod-store>=1.0.0,<2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
canvod-config = { workspace = true }
canvod-grids = { workspace = true }
canvod-store = { workspace = true }

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy"
Documentation = "https://canvodpy.eu/packages/ops/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy"
Issues = "https://github.com/TUW-GEO/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.ops"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--disable-warnings"]
