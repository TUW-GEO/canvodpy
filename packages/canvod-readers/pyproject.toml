[project]
name = "canvod-readers"
version = "0.4.0"
description = "Readers for GNSS observation files: RINEX, SBF, and NMEA"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "RINEX",
    "SBF",
    "NMEA",
    "GPS",
    "geodesy",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "georinex>=1.16.0",
    "matplotlib>=3.7.0",
    "natsort>=8.4.0",
    "numpy>=1.24.0",
    "pint>=0.23",
    "pydantic>=2.5.0",
    "pytz>=2023.3",
    "xarray>=2023.12.0",
    "sbf-parser>=1.0.3",
    "structlog>=24.1.0",
    "canvod-utils>=0.4.0,<2",
    "canvod-config>=0.4.0,<2",
    "pymap3d>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "ty>=0.0.9",
    "marimo>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy"
Documentation = "https://canvodpy.eu/packages/readers/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy"
Issues = "https://github.com/TUW-GEO/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ty.src]
exclude = [
    "**/docs/*.ipynb",
    "**/docs/examples.py",
]

[tool.uv.sources]
canvod-utils = { workspace = true }
canvod-config = { workspace = true }

[tool.uv.build-backend]
module-name = "canvod.readers"
# Specifications and manuals are cited in the code, never shipped (#457).
source-exclude = ["*.pdf"]
