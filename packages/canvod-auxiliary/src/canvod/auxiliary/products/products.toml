# IGS Product Registry Configuration
#
# Final and rapid SP3/CLK products and the FTP servers that host them.
# Users can extend this file to add custom products or servers.
#
# Checked 2026-10-05 against the directory listings of ESA GSSC and NASA
# CDDIS for 2025-001 and 2026-244; recheck with `just check-products`.
#
# Per product:
#   sp3_sampling / clk_sampling  every sampling the files have been published
#                                with, tried in this order (agencies changed
#                                them over the years); clk_sampling = [] for
#                                products without clock files
#   systems                      GNSS in the orbits (SP3 header, 2026-244):
#                                G GPS, R GLONASS, E Galileo, C BeiDou, J QZSS
#   ftp_servers                  ESA first (no account), NASA CDDIS second
#                                (needs the NASA Earthdata e-mail)
#
# Not listed: ultra-rapid, real-time and near-real-time products (issued
# several times a day, file names carry the issue hour), and products not
# found on either server for both days (WHU, WUM and NGS rapid).

# ============================================================================
# AGENCIES
# ============================================================================

[agencies]
COD = "Center for Orbit Determination in Europe"
EMR = "Natural Resources Canada"
ESA = "European Space Agency"
GFZ = "GeoForschungsZentrum Potsdam"
GRG = "Centre National d'Études Spatiales (CNES)"
IAC = "Information-Analytical Centre"
IGS = "International GNSS Service"
JAX = "JAXA (multi-GNSS)"
JGX = "JAXA"
JPL = "Jet Propulsion Laboratory"
MIT = "Massachusetts Institute of Technology"
NGS = "National Geodetic Survey"
SIO = "Scripps Institution of Oceanography"
USN = "US Naval Observatory"

# ============================================================================
# PRODUCTS
# ============================================================================

[[products]]
agency = "COD"
type = "final"
prefix = "COD0MGXFIN"
sp3_sampling = ["05M"]
clk_sampling = ["30S"]
systems = "GRECJ"
description = "CODE final multi-GNSS"
ftp_path = "/gnss/products/{gps_week}/{file}"

[[products.ftp_servers]]
url = "ftp://gssc.esa.int"
priority = 1
description = "ESA GSSC"

[[products.ftp_servers]]
url = "ftps://gdc.cddis.eosdis.nasa.gov"
priority = 2
requires_auth = true
description = "NASA CDDIS"

