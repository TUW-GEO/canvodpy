[project]
name = "canvod-auxiliary"
version = "0.4.0"
description = "Satellite orbits and clocks, and the satellite angles of each GNSS observation"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "VOD",
    "auxiliary",
    "SP3",
    "CLK",
    "ephemeris",
    "clock",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "canvod-readers>=1.0.0,<2",
    "canvod-utils>=1.0.0,<2",
    "canvod-config>=1.0.0,<2",
    "scipy>=1.15.0",
    "numpy>=1.24.0",
    "xarray>=2023.12.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "pint>=0.23",
    "pymap3d>=3.0.0",
    "rich>=13.0",
    "structlog>=24.1.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "ty>=0.0.9",
    "marimo>=0.9.0",
    "matplotlib>=3.8.0",
    "polars>=1.0.0",
]

[tool.uv.sources]
canvod-readers = { workspace = true }
canvod-utils = { workspace = true }
canvod-config = { workspace = true }

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy"
Documentation = "https://canvodpy.eu/packages/auxiliary/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy"
Issues = "https://github.com/TUW-GEO/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.auxiliary"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "network: marks tests that require network access",
]
