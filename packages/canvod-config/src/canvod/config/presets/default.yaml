  # RINEX 2.11 band-only SIDs (code 'u') — same SVs as the RINEX 3 L1/G1/E1
  # entries above. RINEX 2 does not record the code type of carrier phase,
  # Doppler or signal strength (rinex211.txt Sect. 10.1.1, Table A1), so S1
  # lands in SV|<band>|u. Included only on the L1-type bands:
  #   GLONASS G1, Galileo E1: RINEX 3.04 defines codeless and semi-codeless
  #     attributes (N, D) for GPS only (RINEX 3.04 Sect. 5.1), so no RINEX 3
  #     code type of these bands denotes codeless or semi-codeless tracking.
  #   GPS L1: RINEX 3.04 Table 4 also lists P(Y) tracked codelessly (N) or
  #     by Z-tracking (W) — S1 is ASSUMED not to come from either; RINEX
  #     2.11 cannot verify this.
  # GPS L2 'u' is excluded: on satellites without L2C, L2 carries P(Y) or,
  # if selected by ground command, C/A (IS-GPS-200N Sect. 3.2.3). Civil
  # receivers track P(Y) only by codeless or semicodeless processing (Betz &
  # Cerruti 2020, NAVIGATION 67(1), doi:10.1002/navi.347), and RINEX 2
  # cannot tell these tracking modes from L2C. GLONASS G2 and Galileo
  # E5a/E5b 'u' are not included (L1-type bands only).
  # See docs/packages/readers/rinex-v2-format.md.

