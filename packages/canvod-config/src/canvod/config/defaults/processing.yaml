# ============================================================================
# Default Processing Configuration
# ============================================================================
# These are package defaults. Users should create config/processing.yaml
# with their own settings by running: just config-init

metadata:
  author: Unknown
  email: user@example.com
  institution: Unknown Institution

credentials:
  nasa_earthdata_acc_mail: null  # Prefer: set CANVOD__PROCESSING__CREDENTIALS__NASA_EARTHDATA_ACC_MAIL in config/.env

aux_data:
  agency: COD
  product_type: final

params:
  keep_gnss_observables:
    - SNR
  rinex_v3_parser: validated  # 'unvalidated_fast' is DANGEROUS: no checks, results are the user's responsibility
  aggregate_glonass_fdma: true
  store_radial_distance: false
  store_delta_snr: false
  store_radial_diff: false
  receiver_position_mode: shared
  ephemeris_source: final  # 'final' (SP3/CLK) or 'broadcast' (SBF SatVisibility)
  days_per_batch: 1
  resource_mode: auto
  # n_max_threads, max_memory_gb, cpu_affinity, nice_priority
  # are only used when resource_mode: manual

netcdf_compression:
  zlib: true
  complevel: 5

icechunk:
  compression_level: 3
  compression_algorithm: zstd
  inline_chunk_threshold_bytes: 512
  get_partial_values_concurrency: 1
  # max_concurrent_requests: null   # icechunk default
  # cache_num_chunk_refs: null      # icechunk default
  # cache_num_bytes_chunks: null    # icechunk default
  chunk_strategies:
    gnss_store:
      epoch: 17280  # 24h at 5s sampling; override to match your site's rate
      sid: -1
    vod_store:
      epoch: 17280
      sid: -1
  manifest_preload_enabled: false
  manifest_preload_max_refs: 10000
  manifest_preload_max_arrays_to_scan: 500
  manifest_preload_pattern: "^(epoch|sid)$"
  manifest_splitting_enabled: true
  manifest_splitting_epoch_range: 17280

storage:
  stores_root_dir: /path/to/stores  # MUST be set by user!
  gnss_store_strategy: skip

logging:
  log_dir: null  # Defaults to .logs/ in monorepo root
  log_file_name: canvodpy.log
  log_path_depth: 6
