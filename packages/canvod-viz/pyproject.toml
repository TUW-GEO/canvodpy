[project]
name = "canvod-viz"
version = "0.4.0"
description = "Basic visualization tools for GNSS-Transmissometry VOD data"
readme = "README.md"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "numpy>=1.26.0",
    "canvod-grids>=0.1.0",
]

[tool.uv.sources]
canvod-grids = { workspace = true }

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy"
Documentation = "https://canvodpy.eu/packages/viz/overview/"
Repository = "https://github.com/nfb2021/canvodpy"
Issues = "https://github.com/nfb2021/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.ty.src]
exclude = [
    "**/docs/*.ipynb",
]

[tool.uv.build-backend]
module-name = "canvod.viz"
