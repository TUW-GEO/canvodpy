[project]
name = "canvod-grids"
version = "0.4.0"
description = "Hemispheric grids for GNSS-Transmissometry"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "VOD",
    "hemispheric grid",
    "equal-area grid",
    "HEALPix",
    "sky plot",
    "remote sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26.0",
    "xarray>=2024.1.0",
    "pandas>=2.1.0",
    "dask>=2024.1.0",
    "polars>=1.0.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
    "structlog>=24.1.0",
    "canvod-utils>=0.4.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
optional = [
    "healpy>=1.16.0",  # For HEALPix grid
]

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy"
Documentation = "https://canvodpy.eu/packages/grids/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy"
Issues = "https://github.com/TUW-GEO/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ty.src]
exclude = [
    "**/docs/*.ipynb",
]

[tool.uv.sources]
canvod-utils = { workspace = true }

[tool.uv.build-backend]
module-name = "canvod.grids"
