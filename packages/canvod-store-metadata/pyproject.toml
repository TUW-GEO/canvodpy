[project]
name = "canvod-store-metadata"
version = "0.4.0"
description = "FAIR-compliant metadata management for canVODpy stores"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["GNSS", "VOD", "metadata", "icechunk", "zarr", "DataCite", "ACDD", "STAC"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pydantic>=2.0",
    "icechunk>=2.0.0",
    "zarr>=3.1.2",
    "numpy>=1.24.0",
    "polars>=1.0.0",
    "canvod-config>=0.4.0,<2",
    "filelock>=3.15",
    "structlog>=24.1.0",
    "zarr-cm>=0.5.0",
    "canvod-utils>=0.4.0,<2",
    "pystac>=1.15",
]

[dependency-groups]
dev = [
    "compliance-checker>=6.1.0",
    "pytest>=8.0",
    "stac-valid>=4.6",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "ty>=0.0.9",
]

[tool.uv.sources]
canvod-config = { workspace = true }
canvod-utils = { workspace = true }

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy"
Documentation = "https://canvodpy.eu/packages/store-metadata/overview/"
Repository = "https://github.com/nfb2021/canvodpy"
Issues = "https://github.com/nfb2021/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.store_metadata"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
