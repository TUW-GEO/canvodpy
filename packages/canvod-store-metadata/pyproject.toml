[project]
name = "canvod-store-metadata"
version = "1.0.0"
description = "Store metadata for canVODpy stores, in DataCite, ACDD, and STAC"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "VOD",
    "metadata",
    "icechunk",
    "zarr",
    "DataCite",
    "ACDD",
    "STAC",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.0",
    "icechunk>=2.0.0",
    "zarr>=3.1.2",
    "numpy>=1.24.0",
    "polars>=1.0.0",
    "canvod-config>=1.0.0,<2",
    "filelock>=3.15",
    "structlog>=24.1.0",
    "zarr-cm>=0.5.0",
    "canvod-utils>=1.0.0,<2",
    "pystac>=1.15",
]

[dependency-groups]
dev = [
    "compliance-checker>=6.1.0",
    "pytest>=8.0",
    "stac-valid>=4.6",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "ty>=0.0.9",
]

[tool.uv.sources]
canvod-config = { workspace = true }
canvod-utils = { workspace = true }

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy"
Documentation = "https://canvodpy.eu/packages/store-metadata/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy"
Issues = "https://github.com/TUW-GEO/canvodpy/issues"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.store_metadata"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
