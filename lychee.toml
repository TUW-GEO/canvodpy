# lychee: link check for the built docs site (just docs-links).
# Links between our pages and their anchors are checked against site/.
include_fragments = "full"
cache = true
max_cache_age = "1d"
max_retries = 2
timeout = 20
accept = ["200..=299", "429"]
# site/ and its HTML are git-ignored; lychee skips ignored files otherwise.
no_ignore = true
# Pages are folders with an index.html (users/cli/ -> users/cli/index.html).
index_files = ["index.html"]
exclude_path = [
  # Links from the 404 page carry the deployed path prefix (/canvodpy/).
  "site/404\\.html$",
]
exclude = [
  # The published site itself (canonical links): checked locally instead.
  "^https://nfb2021\\.github\\.io/canvodpy/",
  # Answer automated requests with 403 although the pages exist.
  "^https://coveralls\\.io/",
  "^https://github\\.com/signup",
  "^https://www\\.septentrio\\.com/",
  "^https://doi\\.org/10\\.3233/",
]
