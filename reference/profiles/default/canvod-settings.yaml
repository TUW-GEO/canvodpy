# Setting profile "default" of the reference stores (spec #318).
#
# Final SP3/CLK from the test data, no preprocessing, 15 SIDs per system.
# `just reference-stores` and `just reference-check` run it with
# `canvodpy run --config-dir reference/profiles/default` from the root of
# the repository; they add the output folders (stores, auxiliary files,
# logs) with a settings file passed as --config. The data paths below are
# relative to the root of the repository.
processing:
  # The made-up identity of the tests (canvod.utils.testing): the
  # reference stores name no real person.
  metadata:
    author: John Ronald Reuel Tolkien
    email: j.r.r.tolkien@the.inklings.org
    institution: University of Oxford
    license: CC-BY-4.0
    publisher: The Inklings
    naming_authority: org.middle-earth
  aux_data:
    agency: COD
    product_type: final
  params:
    keep_gnss_observables:
      - SNR
    aggregate_glonass_fdma: true
    receiver_position_mode: shared
    file_pairing: complete
    ephemeris_source: final
    resource_mode: auto
  storage:
    gnss_store_strategy: skip
sites:
  rosalia_rinex_v3_04:
    gnss_site_data_root: packages/canvod-readers/tests/test_data/valid/rinex_v3_04/01_Rosalia
    store_description: Reference store of the RINEX v3.04 test data of Rosalia, 2025-01-01.
    receivers:
      reference_01:
        type: reference
        directory: 01_reference/01_GNSS/01_raw
        reader_format: rinex3
        paired_canopies: all
      canopy_01:
        type: canopy
        directory: 02_canopy/01_GNSS/01_raw
        reader_format: rinex3
    vod_analyses:
      canopy_01_vs_reference_01:
        canopy_receiver: canopy_01
        reference_receiver: reference_01
  moflux_rinex_v2_11:
    gnss_site_data_root: packages/canvod-readers/tests/test_data/valid/rinex_v2_11/02_Moflux
    store_description: Reference store of the RINEX v2.11 test data of MOFLUX, 2025-01-01.
    receivers:
      reference_01:
        type: reference
        directory: 01_reference
        reader_format: rinex2
        paired_canopies: all
      canopy_01:
        type: canopy
        directory: 02_canopy
        reader_format: rinex2
    vod_analyses:
      canopy_01_vs_reference_01:
        canopy_receiver: canopy_01
        reference_receiver: reference_01
  examplesite_rinex_v3_05_stripped:
    gnss_site_data_root: packages/canvod-readers/tests/test_data/valid/rinex_v3_05_stripped/01_ExampleSite
    store_description: Reference store of the stripped RINEX v3.05 test data of ExampleSite, 2025-01-01.
    receivers:
      reference_01:
        type: reference
        directory: 01_reference
        reader_format: rinex3_stripped
        paired_canopies: all
      canopy_01:
        type: canopy
        directory: 01_canopy
        reader_format: rinex3_stripped
    vod_analyses:
      canopy_01_vs_reference_01:
        canopy_receiver: canopy_01
        reference_receiver: reference_01
  rosalia_sbf:
    gnss_site_data_root: packages/canvod-readers/tests/test_data/valid/sbf/01_Rosalia
    store_description: Reference store of the SBF test data of Rosalia, 2025-01-01.
    receivers:
      reference_01:
        type: reference
        directory: 01_reference
        reader_format: sbf
        paired_canopies: all
      canopy_01:
        type: canopy
        directory: 02_canopy
        reader_format: sbf
    vod_analyses:
      canopy_01_vs_reference_01:
        canopy_receiver: canopy_01
        reference_receiver: reference_01
  rosalia_nmea:
    gnss_site_data_root: packages/canvod-readers/tests/test_data/valid/nmea/01_Rosalia
    store_description: Reference store of the NMEA test data of Rosalia, 2025-01-01.
    receivers:
      reference_01:
        type: reference
        directory: 01_reference
        reader_format: nmea
        paired_canopies: all
      canopy_01:
        type: canopy
        directory: 02_canopy
        reader_format: nmea
    vod_analyses:
      canopy_01_vs_reference_01:
        canopy_receiver: canopy_01
        reference_receiver: reference_01
  hainich_nmea:
    gnss_site_data_root: packages/canvod-readers/tests/test_data/valid/nmea/02_Hainich
    store_description: Reference store of the NMEA test data of Hainich, 2026-01-01.
    receivers:
      reference_01:
        type: reference
        directory: 01_reference
        reader_format: nmea
        paired_canopies: all
      canopy_01:
        type: canopy
        directory: 02_canopy
        reader_format: nmea
    vod_analyses:
      canopy_01_vs_reference_01:
        canopy_receiver: canopy_01
        reference_receiver: reference_01
